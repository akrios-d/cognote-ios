<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <radialGradient id="sky" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#2a2552"/>
      <stop offset="0.55" stop-color="#16163a"/>
      <stop offset="1" stop-color="#0b0c1f"/>
    </radialGradient>
    <radialGradient id="cityGlow" cx="50%" cy="100%" r="65%">
      <stop offset="0" stop-color="#e0702a" stop-opacity="0.75"/>
      <stop offset="0.45" stop-color="#a3561e" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#a3561e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bookHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffcf7a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffcf7a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2463a"/>
      <stop offset="0.6" stop-color="#c22d22"/>
      <stop offset="1" stop-color="#931c15"/>
    </linearGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7d1610"/>
      <stop offset="1" stop-color="#a82219"/>
    </linearGradient>
    <linearGradient id="pages" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f3e6cc"/>
      <stop offset="1" stop-color="#e2cfa8"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe39a"/>
      <stop offset="1" stop-color="#f0b448"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="blurBig" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="28" stdDeviation="30" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- night sky + warm city glow (from the original icon) -->
  <rect width="1024" height="1024" fill="url(#sky)"/>
  <rect width="1024" height="1024" fill="url(#cityGlow)"/>

  <!-- distant skyline silhouettes with lit windows -->
  <g opacity="0.55">
    <rect x="40" y="610" width="120" height="414" fill="#1d1a36"/>
    <rect x="150" y="690" width="90" height="334" fill="#221d3c"/>
    <rect x="800" y="560" width="130" height="464" fill="#1d1a36"/>
    <rect x="910" y="660" width="114" height="364" fill="#221d3c"/>
    <g fill="#f6b955">
      <rect x="62" y="640" width="12" height="9"/><rect x="92" y="640" width="12" height="9"/><rect x="122" y="672" width="12" height="9"/>
      <rect x="62" y="704" width="12" height="9"/><rect x="122" y="736" width="12" height="9"/><rect x="92" y="768" width="12" height="9"/>
      <rect x="170" y="720" width="12" height="9"/><rect x="200" y="752" width="12" height="9"/><rect x="170" y="784" width="12" height="9"/>
      <rect x="822" y="592" width="12" height="9"/><rect x="852" y="624" width="12" height="9"/><rect x="882" y="592" width="12" height="9"/>
      <rect x="822" y="656" width="12" height="9"/><rect x="882" y="688" width="12" height="9"/><rect x="852" y="720" width="12" height="9"/>
      <rect x="932" y="690" width="12" height="9"/><rect x="962" y="722" width="12" height="9"/><rect x="992" y="690" width="12" height="9"/>
    </g>
  </g>

  <!-- bokeh lights -->
  <g filter="url(#soft)">
    <circle cx="120" cy="900" r="22" fill="#ffb347" opacity="0.55"/>
    <circle cx="250" cy="960" r="30" fill="#ff8c3a" opacity="0.45"/>
    <circle cx="390" cy="985" r="18" fill="#ffd27a" opacity="0.55"/>
    <circle cx="640" cy="975" r="26" fill="#ff9a45" opacity="0.5"/>
    <circle cx="790" cy="930" r="20" fill="#ffd27a" opacity="0.5"/>
    <circle cx="930" cy="880" r="28" fill="#ff8c3a" opacity="0.45"/>
    <circle cx="70" cy="760" r="14" fill="#ffd27a" opacity="0.5"/>
    <circle cx="975" cy="770" r="16" fill="#ffb347" opacity="0.5"/>
    <circle cx="180" cy="300" r="10" fill="#ffd27a" opacity="0.35"/>
    <circle cx="880" cy="250" r="12" fill="#ffb347" opacity="0.35"/>
  </g>
  <g fill="#ffe2a0">
    <circle cx="300" cy="880" r="4" opacity="0.9"/>
    <circle cx="720" cy="890" r="5" opacity="0.8"/>
    <circle cx="560" cy="940" r="3.5" opacity="0.9"/>
    <circle cx="860" cy="820" r="3.5" opacity="0.8"/>
    <circle cx="160" cy="820" r="3" opacity="0.8"/>
    <circle cx="110" cy="160" r="2.5" opacity="0.7"/>
    <circle cx="300" cy="110" r="2" opacity="0.6"/>
    <circle cx="930" cy="140" r="2.5" opacity="0.7"/>
    <circle cx="760" cy="90" r="2" opacity="0.6"/>
    <circle cx="60" cy="420" r="2" opacity="0.6"/>
  </g>

  <!-- warm halo behind the notebook -->
  <circle cx="512" cy="520" r="360" fill="url(#bookHalo)"/>

  <!-- the red notebook, tilted like the one in the original -->
  <g transform="translate(512 535) scale(1.13) translate(-512 -535) rotate(-8 512 540)" filter="url(#shadow)">
    <!-- page block -->
    <rect x="318" y="262" width="420" height="560" rx="22" fill="url(#pages)"/>
    <g stroke="#cdb688" stroke-width="3" opacity="0.8">
      <line x1="728" y1="292" x2="728" y2="792"/>
      <line x1="720" y1="292" x2="720" y2="792"/>
      <line x1="712" y1="292" x2="712" y2="792"/>
    </g>
    <!-- cover -->
    <rect x="286" y="240" width="430" height="572" rx="26" fill="url(#cover)"/>
    <!-- spine -->
    <path d="M312 240 h44 v572 h-44 a26 26 0 0 1 -26 -26 v-520 a26 26 0 0 1 26 -26 z" fill="url(#spine)"/>
    <line x1="356" y1="250" x2="356" y2="802" stroke="#6e130d" stroke-width="3" opacity="0.6"/>
    <!-- elastic band -->
    <rect x="652" y="240" width="18" height="572" fill="#7a150f" opacity="0.85"/>
    <!-- cover sheen -->
    <path d="M356 240 h220 l-120 572 h-100 z" fill="#ffffff" opacity="0.06"/>

    <!-- gold thought bubble with a spark: the "cognitive" note -->
    <g fill="none" stroke="url(#gold)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
      <path d="M408 470
               C392 410 440 368 494 380
               C514 336 590 330 612 380
               C664 372 696 420 676 466
               C710 498 690 556 640 556
               C628 596 568 606 540 576
               C506 604 446 590 444 552
               C398 548 384 500 408 470 Z"/>
    </g>
    <circle cx="448" cy="626" r="17" fill="url(#gold)"/>
    <circle cx="416" cy="672" r="10" fill="url(#gold)"/>
    <!-- spark inside the bubble -->
    <path d="M540 404 C548 446 558 456 600 464 C558 472 548 482 540 524 C532 482 522 472 480 464 C522 456 532 446 540 404 Z"
          fill="url(#gold)" filter="url(#glow)"/>

    <!-- ribbon bookmark -->
    <path d="M610 812 v96 l-22 -20 l-22 20 v-96 z" fill="#f0b448"/>
  </g>

  <!-- ideas rising from the notebook -->
  <g fill="#ffe39a" filter="url(#glow)">
    <path d="M790 250 C794 272 800 278 822 282 C800 286 794 292 790 314 C786 292 780 286 758 282 C780 278 786 272 790 250 Z"/>
    <path d="M846 360 C848 372 852 376 864 378 C852 380 848 384 846 396 C844 384 840 380 828 378 C840 376 844 372 846 360 Z"/>
    <path d="M232 214 C235 230 239 234 255 237 C239 240 235 244 232 260 C229 244 225 240 209 237 C225 234 229 230 232 214 Z" opacity="0.85"/>
  </g>
  <g fill="#ffd27a">
    <circle cx="742" cy="196" r="5"/>
    <circle cx="186" cy="330" r="4" opacity="0.8"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
